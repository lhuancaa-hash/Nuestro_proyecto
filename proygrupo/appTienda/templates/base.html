<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Inventario{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        .table-actions {
            white-space: nowrap;
        }
        .main-nav {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
    </style>
</head>
<body>

    <!-- NAVBAR PRINCIPAL OSCURA -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_movimientos' %}">
                🏪 Sistema de Inventario
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'listar_movimientos' %}">
                            📦 Movimientos de Stock
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- NAVBAR SECUNDARIA CLARA -->
    <nav class="navbar navbar-expand-lg navbar-light main-nav">
        <div class="container">
            <div class="navbar-nav">

                <a class="nav-link text-dark" href="{% url 'listar_movimientos' %}">
                    🏠 Inicio
                </a>

                <!-- 🔥 NUEVO BOTÓN AGREGADO: PROVEEDORES -->
                <a class="nav-link text-dark" href="{% url 'lista_proveedores' %}">
                    🧾 Proveedores
                </a>

                <a class="nav-link text-dark" href="{% url 'crear_movimiento' %}">
                    ➕ Nuevo Movimiento
                </a>

            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-light mt-5 py-3">
        <div class="container text-center">
            <small>Control de Inventario &copy; 2025</small>
        </div>
    </footer>

    <!-- MODAL PARA ELIMINACION -->
    <div class="modal fade" id="eliminarModal" tabindex="-1" aria-labelledby="eliminarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="eliminarModalLabel">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ¿Está seguro que desea eliminar este movimiento?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form id="eliminarForm" method="post" action="">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function configurarEliminacion(url) {
            document.getElementById('eliminarForm').action = url;
        }
    </script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
