{% extends "base.html" %}

{% block content %}
<h2>¿Seguro que deseas eliminar a {{ proveedor.nombre }}?</h2>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'lista_proveedores' %}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
